name: Проверки

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Сборка и проверки
        run: ./build.sh --no-install
      - name: Снимки окна настроек и значка
        uses: actions/upload-artifact@v4
        with:
          name: snapshots
          path: build/snapshots/
